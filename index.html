 B={fire:{x:rt-U*1.2,y:bt-U*2.7,r:U*1.05,l:'FIRE'},auto:{x:rt-U*1.3,y:bt-U*4.45,r:U*.68,l:'AUTO'},swap:{x:W/2-U*3.8,y,r:U*.78,l:'SWAP'},reload:{x:W/2-U*1.9,y,r:U*.78,l:'RELOAD'},heal:{x:W/2,y,r:U*.78,l:'HEAL'},build:{x:W/2+U*1.9,y,r:U*.78,l:'BUILD'},dash:{x:U*5.7,y:bt-U*3.8,r:U*.57,l:'DASH'},pause:{x:Math.max(10,SA.l+8)+U*.4,y:Math.max(8,SA.t+8)+U*.4,r:U*.42,l:''},sprint:{x:U*4.6,y:bt-U*2.2,r:U*.55,l:'RUN'},ping:{x:rt-U*3.15,y:bt-U*2.7,r:U*.57,l:'PING'},vehicle:{x:rt-U*4.1,y:bt-U*4.15,r:U*.54,l:'VEH'},ads:{x:rt-U*2.55,y:bt-U*4.15,r:U*.52,l:'ADS'},gadget:{x:rt-U*3.25,y:bt-U*3.7,r:U*.56,l:'GEAR'},gadgetswitch:{x:rt-U*4.25,y:bt-U*3.35,r:U*.5,l:'NEXT'},buildnext:{x:W/2+U*3.8,y,r:U*.52,l:'TYPE'},repair:{x:W/2-U*3.8,y,r:U*.52,l:'FIX'}};for(const k of CONTROL_KEYS){const q=buttonLayout[k],b=B[k];if(q&&b){b.x=cl(q.x*W,b.r+5,W-b.r-5);b.y=cl(q.y*H,b.r+5,H-b.r-5)}}}
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);cv.width=W*dpr|0;cv.height=H*dpr|0;Z=cl(H/470,.6,1.35);safe();layout();const pt=H>W?1:0;if(pt!==port){port=pt;clearInput()}}
function frame(t){requestAnimationFrame(frame);const dt=cl((t-last)/1000||0,0,.05);last=t;if(S==='play'&&W>H&&!document.hidden)update(dt);draw()}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));
cv.addEventListener('contextlost',e=>{e.preventDefault();notify('GRAPHICS RECOVERING…',2)});
window.addEventListener('error',e=>{console.error('LASTLIGHT error:',e.message,e.filename,e.lineno);if(S==='play'&&p){clearInput();notify('A game error occurred. Controls were reset.',3)}});
resize();applyCurrentMap();genWorld();menu();requestAnimationFrame(frame);
/* LASTLIGHT: final drone + HUD usability pass */
(function(){
  // A drone can now deliberately collide with building walls and placed structures.
  // The flight controller still handles rocks, enemies and island edges; this adds walls.
  const _flightBeforeWallCrash = updateDroneFlight;
  updateDroneFlight = function(dt){
    const d=remoteDrone;
    const ox=d&&d.active?d.x:0, oy=d&&d.active?d.y:0;
    _flightBeforeWallCrash(dt);
    if(!d||!d.active||remoteDrone!==d)return;
    const dx=d.x-ox,dy=d.y-oy;
    if(dx*dx+dy*dy>1){
      const wall=rayWall(ox,oy,d.x,d.y);
      if(wall&&wall.t>=0&&wall.t<.995){
        const t=Math.max(0,wall.t-.012);
        stopRemoteDrone(true,ox+dx*t,oy+dy*t,'DRONE CRASHED INTO A BUILDING');
        return;
      }
      for(const v of vehicles){
        if(v.hp>0&&segCirc(ox,oy,d.x,d.y,v.x,v.y,27)){
          stopRemoteDrone(true,v.x,v.y,'DRONE CRASHED INTO A VEHICLE');
          return;
        }
      }
    }
  };

  // Hostile rockets can also damage the fragile drone, not just regular bullets.
  const _rocketsBeforeDroneHit = updRockets;
  updRockets = function(dt){
    if(remoteDrone&&remoteDrone.active){
      for(let i=rockets.length-1;i>=0;i--){
        const b=rockets[i];
        if(!b||b.o===p)continue;
        const nx=b.x+b.vx*dt,ny=b.y+b.vy*dt;
        if(segCirc(b.x,b.y,nx,ny,remoteDrone.x,remoteDrone.y,15)){
          const hx=remoteDrone.x,hy=remoteDrone.y;
          remoteDrone.hp-=Math.max(9,(b.dmg||24)*.42);
          rockets.splice(i,1);ring(hx,hy,b.shock?'#7eeaff':'#ff9b65',36);spark(hx,hy,b.shock?'#7eeaff':'#ff9b65',7);
          if(remoteDrone&&remoteDrone.hp<=0)stopRemoteDrone(true,hx,hy,'DRONE DESTROYED');
        }
      }
    }
    _rocketsBeforeDroneHit(dt);
  };

  // Neat button visuals: high contrast, subtle action colors and clear pressed states.
  const _bdBeforePolish = bd;
  bd = function(k,sub,on){
    const b=B&&B[k];
    if(!b||b.r<=0||b.x<-200||b.y<-200)return;
    const st=controlStyle[k]||{},alpha=cl(Number.isFinite(+st.alpha)?+st.alpha:.72,.2,1);
    const colors={fire:'#ff7166',dash:'#52d9ff',sprint:'#7cf0a5',swap:'#a8c9ff',build:'#e9b56e',buildnext:'#88e8ff',gadget:'#ffdc78',heal:'#79efa4',reload:'#ffd06c',vehicle:'#ffc46e',droneboom:'#ff6157',pause:'#d5e8f0'};
    const c=colors[k]||hudAccent||'#7deaff';
    cx.save();
    cx.globalAlpha=alpha;
    cx.shadowColor=on?c:'rgba(0,0,0,.12)';cx.shadowBlur=on?Math.max(4,b.r*.22):0;
    cx.fillStyle=on?hexAlpha(c,.25):'rgba(6,18,28,.82)';
    cx.strokeStyle=controlLayoutMode?'#8cf6ff':(on?c:'rgba(219,242,250,.72)');
    cx.lineWidth=on?2.8:1.6;
    cx.beginPath();cx.arc(b.x,b.y,b.r,0,TAU);cx.fill();cx.stroke();cx.shadowBlur=0;
    if(on){cx.strokeStyle=hexAlpha(c,.48);cx.lineWidth=1;cx.beginPath();cx.arc(b.x,b.y,Math.max(2,b.r-4),0,TAU);cx.stroke()}
    if(b.l){cx.fillStyle='#fff';cx.textAlign='center';cx.textBaseline='middle';cx.font='900 '+Math.max(8,Math.min(b.r*.43,b.r*.58))+'px system-ui,sans-serif';cx.fillText(b.l,b.x,b.y-(sub?b.r*.12:0),b.r*1.7)}
    if(sub){cx.fillStyle='#d9f9ff';cx.textAlign='center';cx.textBaseline='middle';cx.font='800 '+Math.max(7,b.r*.30)+'px system-ui,sans-serif';cx.fillText(String(sub),b.x,b.y+b.r*.43,b.r*1.65)}
    cx.restore();
  };

  // Put FIRE and RELOAD apart so their touch targets cannot overlap on phones.
  const _contextBeforeFinalLayout = updateContextButtons;
  updateContextButtons = function(){
    _contextBeforeFinalLayout();
    if(!B||S!=='play'||!p)return;
    const editor=S==='hud'&&controlLayoutMode;
    const place=(key,fx,fy,rad,label)=>{
      const b=B[key]||(B[key]={}),saved=buttonLayout[key],st=controlStyle[key]||{};
      b.r=U*rad*(st.scale||1);b.l=label;
      b.x=saved?cl(saved.x*W,b.r+5,W-b.r-5):fx;
      b.y=saved?cl(saved.y*H,b.r+5,H-b.r-5):fy;
    };
    const hide=key=>{if(B[key]){B[key].x=-1400;B[key].y=-1400;B[key].r=0}};
    if(editor)return;
    // FIRE lives on the far right. RELOAD is left of it with real tap-space between them.
    if(!autoFire)place('fire',W*.92,H-U*2.72,.66,'FIRE');
    if(B.reload&&B.reload.r>0)place('reload',W*.84,H-U*3.25,.39,'RELOAD');
    if(remoteDrone&&remoteDrone.active){
      const mid=W*.5,rowY=H-U*1.32;
      // The pilot gets the same weapon/build/heal actions, while movement-only controls disappear.
      place('swap',mid-U*3.22,rowY,.46,'SWAP');
      place('build',mid-U*1.72,rowY,.46,'BUILD');
      place('buildnext',mid-U*.20,rowY,.38,'TYPE');
      place('gadget',mid+U*1.42,rowY,.47,'RETURN');
      const canHeal=(p.hp<99&&p.med>0)||(p.sh<99&&p.pot>0)||p.hl>0;
      if(canHeal)place('heal',mid+U*3.05,rowY,.45,'HEAL');else hide('heal');
      place('droneboom',W*.84,H-U*1.38,.45,'BOOM');
      hide('dash');hide('sprint');hide('vehicle');hide('ping');hide('ads');hide('gadgetswitch');hide('repair');
      const g=p.sl[p.cur],w=g&&WD[g.t];
      if(!g||!w||w.mel||g.mag>=magCapacity(g)||!(p.am[w.ammo]>0)&&!(p.rel>0))hide('reload');
    }else{
      // The normal player only sees HEAL when a carried item can help and ENTER near a buggy.
      const canHeal=(p.hp<99&&p.med>0)||(p.sh<99&&p.pot>0)||p.hl>0;
      if(!canHeal)hide('heal');
      const near=!!drivingVehicle||(B.vehicle&&B.vehicle.r>0&&B.vehicle.x>-200);
      if(B.vehicle&&B.vehicle.r>0&&drivingVehicle)place('vehicle',W*.83,H-U*2.25,.43,'EXIT');
      else if(near&&B.vehicle&&B.vehicle.r>0)place('vehicle',W*.83,H-U*2.25,.43,'ENTER');
    }
  };

  // While controlling the drone, BUILD acts at the drone's current position. HEAL heals the parked pilot.
  function buildAtDrone(){
    const d=remoteDrone;if(!d||!d.active||!p||p.mats<10){notify('NOT ENOUGH MATERIALS',1.1);return}
    const old={x:p.x,y:p.y,a:p.a};p.x=d.x;p.y=d.y;p.a=d.a;
    try{
      if(buildType==='edit')recycleStructure(p);
      else {const r=spot(p);if(r.ok){put(p,r);spark(r.x+r.w/2,r.y+r.h/2,'#c89b5a',7);notify('DRONE BUILD · '+buildType.toUpperCase(),.9)}else notify('BUILD SPACE BLOCKED',.9)}
    } finally {p.x=old.x;p.y=old.y;p.a=old.a}
  }
  addEventListener('pointerdown',function(e){
    if(S!=='play'||!remoteDrone||!remoteDrone.active||controlLayoutMode||!B)return;
    const b=B.build;if(b&&b.r>0&&Math.hypot(e.clientX-b.x,e.clientY-b.y)<=b.r*1.15){e.preventDefault();e.stopImmediatePropagation();buildAtDrone();}
  },true);

  // Keep the drone's current weapon, loaded ammo, low health and detonation reminder readable.
  const _hudBeforeFinalDroneInfo = hud;
  hud = function(){
    _hudBeforeFinalDroneInfo();
    if(S!=='play'||!remoteDrone||!remoteDrone.active||!p)return;
    cx.setTransform(dpr,0,0,dpr,0,0);
    const d=remoteDrone,g=p.sl[p.cur],w=g&&WD[g.t],ammo=g&&w&&w.ammo?(p.am[w.ammo]||0):0;
    const bw=Math.min(W*.82,430),bh=U*.91,x=(W-bw)/2,y=U*2.03;
    cx.save();cx.fillStyle='rgba(4,18,28,.88)';cx.strokeStyle=d.hp<13?'#ff6c62':'#70e8ff';cx.lineWidth=1.6;cx.beginPath();roundRectPath(x,y,bw,bh,10);cx.fill();cx.stroke();
    tx('DRONE  ·  HP '+Math.ceil(d.hp)+'/'+d.maxHp+'  ·  BATTERY '+Math.ceil(d.battery)+'s',W/2,y+bh*.22,U*.22,d.hp<13?'#ff887d':'#d8fbff','center');
    tx((w?w.n:'NO WEAPON').toUpperCase()+'  ·  '+(g&&w&&!w.mel?(g.mag+' / '+ammo+' AMMO'):'MELEE'),W/2,y+bh*.51,U*.22,'#ffffff','center');
    tx(autoFire?'AIM TO TRACK & FIRE  ·  BOOM TO DETONATE':'AIM + FIRE  ·  X OR BOOM TO DETONATE',W/2,y+bh*.79,U*.175,'#8fe9ff','center');
    cx.restore();
  };
})();
